flarum-gdpr:
  lib:
    data:
      uploads:
        anonymize_description: 'Usuwa odniesienie do użytkownika z przesłanych plików. Same pliki wciąż pozostają dostępne dla użytkowników, którzy mogli zobaczyć je przed anonimizacją.'
        delete_description: 'Usuwa wszystkie pliki przesłane przez użytkownika.'
        export_description: 'Wszystkie pliki przesłane przez użytkownika.'
fof-upload:
  admin:
    help_texts:
      client_extension: "Domyślnie wtyczka wybierze bezpieczne rozszerzenie dla wysłanego pliku na podstawie typu MIME.\nDla niektórych typów bazujących na ZIP lub plików binarnych, może to skutkować zastąpieniem oryginalnego rozszerzenia na bardziej ogólne.\nTutaj możesz podać listę rozszerzeń (rozdzielonych przecinkami), które mają zostać pozostawione bez zmian.\n"
      composer_buttons: "Domyślnie przycisk dla menedżera multimediów oraz przycisk do wysyłania plików są jednocześnie widoczne. Ale możesz to zmienić i wyświetlać tylko jeden przycisk.\n"
      custom_s3_url: "Publiczny adres bazowy, spod którego serwowane są Twoje pliki — CDN lub własna domena przed bucketem.\nPozostaw puste, aby użyć domyślnego adresu dostawcy. Musi zawierać <code>https://</code>.\n"
      disable-download-logging: "Wyłącz rejestrowanie każdego pobrania przez użytkowników Twojego forum. Pozostawienie tej opcji włączonej pozwoli Ci na zobaczenie ilości pobrań i innych statystyk w niedalekiej przyszłości.\n"
      disable-hotlink-protection: "Ochrona przed hotlinkowaniem zapobiega otwieraniu tutejszych plików z poziomu innych stron. Obecna metoda wymaga tokenu CSRF i identyfikatora posta.\n"
      download_templates: "Szablony pobierania decydują o tym jak przesłane pliki są wyświetlane na Twoim forum, np. podgląd miniatury, przyciski. Obecnie dostępne:\n"
      local_cdn: "Opcjonalne. Jeśli udostępniasz <code>assets/files</code> przez CDN, podaj jego bazowy adres URL. Linki do przesłanych plików będą wtedy korzystać z tego adresu. Pozostaw puste, aby pliki były udostępniane bezpośrednio z forum.\n"
      mime_order: "Reguły są sprawdzane od góry do dołu, a używana jest pierwsza pasująca. Bardziej szczegółowe reguły umieść więc nad ogólnymi.\n"
      mime_types: "Określ, jakie pliki użytkownicy mogą przesyłać, gdzie mają być przechowywane i w jaki sposób będą wyświetlane w postach.\n"
      resize: "Wybierz czy chcesz przeskalować obrazki zanim zostaną przesłane. Możesz wybrać maksymalną szerokość i wysokość w pikselach. Proces zmiany rozmiaru zachowa proporcje obrazka.\n"
      s3_acl: "Stosowane do każdego wysłanego obiektu. Pozostaw puste, aby użyć domyślnego ustawienia dostawcy (zwykle private).\nUżyj <code>public-read</code>, jeśli pliki mają być dostępne do odczytu bezpośrednio z bucketu.\n"
      s3_acl_unsupported: "{provider} nie obsługuje ACL. Dostęp publiczny skonfiguruj bezpośrednio w panelu dostawcy.\n"
      s3_compatible_storage: "Poniższe ustawienia są wymagane jedynie, gdy korzystasz z usługi kompatybilnej z S3. Jeśli korzystasz z AWS, możesz pozostawić je puste.\n"
      s3_endpoint: "Adres URL API S3 dostawcy — nie publiczny adres URL bucketu. W przypadku Amazon S3 nie trzeba go podawać.\n"
      s3_instance_profile: "Pozostaw oba pola puste, aby zamiast tego użyć roli IAM — działa to tylko na EC2, ECS i EKS.\n"
      s3_path_style: "Umieszcza nazwę bucketu w ścieżce URL zamiast w nazwie hosta. Jest to wymagane przez MinIO i Cloudflare R2; ustawienie włącza się automatycznie po wybraniu odpowiedniego dostawcy.\n"
      s3_provider: "Wybór dostawcy automatycznie ustawia format endpointu, sposób adresowania oraz obsługę ACL. Jeśli Twojego dostawcy nie ma na liście, wybierz „Inny zgodny z S3”.\n"
      storage_configure_another: "Inne usługi przechowywania są zainstalowane, ale nie zostały jeszcze skonfigurowane. Sama konfiguracja usługi nie zmieni miejsca zapisywania plików, dopóki nie przypiszesz jej do wybranego typu plików.\n"
      storage_intro: "Tutaj wyświetlane są skonfigurowane usługi oraz te, z których korzysta co najmniej jeden typ pliku. Możesz skonfigurować usługę wcześniej, a przypisać ją do typów plików później na karcie Pliki.\n"
      storage_not_installed: 'Szukasz Amazon S3, Cloudflare R2 lub Qiniu? Te usługi wymagają dodatkowego pakietu — zobacz <a>instalowanie adapterów pamięci masowej</a>.'
      thumbnail_quality: "Jakość kodowania od 1 do 100, stosowana do miniaturek WebP i JPEG. Wyższe wartości zapewniają lepszą jakość, ale zwiększają rozmiar pliku. Miniatury GIF i PNG są bezstratne, więc to ustawienie ich nie dotyczy. Istniejące miniatury zachowają obecną jakość do czasu ponownego wygenerowania ich poleceniem uzupełniającym.\n"
      thumbnails: "Generuj pomniejszone miniatury obrazów podczas przesyłania. Miniatura jest wyświetlana bezpośrednio w poście, a kliknięcie otwiera oryginalny obraz w pełnej rozdzielczości w nowej karcie. Miniatury mogą znacznie zmniejszyć zużycie transferu i rozmiar stron na forach z dużą liczbą dużych obrazów.\n"
      watermark: "Wybierz, czy obrazki będą miały dodany znak wodny podczas przesyłania. Znaki wodne są dodawane do nie-gifów bazując na Twoich preferencjach poniżej.\n"
    inspect-mime:
      description: "FoF Upload wykorzystuje bibliotekę <a>PHP Mime Detector</a> dla popularnych typów MIME i PHP Fileinfo jako rozwiązanie zastępcze.\nWartość MIME zwracana przez Fileinfo może się różnić w zależności od serwera!\n"
