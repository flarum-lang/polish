    cache_enabled_help: 'Zajrzyj na <a>stronę informacyjną</a>, aby dowiedzieć się, jak przetestować cache. UWAGA: Po wyłączeniu cache, cała jego zawartość zostanie usunięta.'
    cache_enabled_label: 'Włącz LSCache'
    cache_exclude_help: 'Podaj po jednym wyrażeniu regularnym w wierszu. <code>/private</code> pasuje do każdej ścieżki zawierającej /private, a <code>^/private$</code> tylko do /private. Parametry zapytania są ignorowane. Strony zapisane już w cache pozostaną dostępne do czasu wygaśnięcia lub wyczyszczenia cache. Aby wykluczenia zaczęły obowiązywać od razu, wyczyść odpowiednie adresy URL za pomocą CLI albo cały LSCache z menu cache w panelu administracyjnym.'
    cache_exclude_label: 'Wyklucz ścieżki z cache'
    clearing_cache_listener_help: 'Wyłączenie tej opcji pozwala uniknąć ponownego generowania cache stron po drobnych zmianach zasobów. Strony zapisane w cache mogą wczytywać przebudowane zasoby spod tych samych adresów URL, podczas gdy CDN, np. Cloudflare, może nadal udostępniać ich starsze wersje z własnego cache. Ustawienia stron i dane rozszerzeń również mogą pozostać nieaktualne. Jeśli wyłączysz tę opcję, po większych aktualizacjach lub zmianach w rozszerzeniach ręcznie wyczyść LSCache.'
    clearing_cache_listener_label: 'Czyść LSCache, kiedy cache Flarum jest czyszczony'
    drop_qs_help: "Wpisz nazwy parametrów zapytania, które mają być ignorowane podczas zapisywania stron w cache, po jednej w wierszu, np. <code>fbclid</code> lub <code>utm*</code>. Adresy URL różniące się tylko tymi parametrami korzystają z tej samej strony zapisanej w cache. Ignoruj wyłącznie parametry, które nie zmieniają zawartości strony. Wymaga LSWS w wersji 5.2.3 lub nowszej. <a>Dowiedz się więcej o pomijaniu parametrów zapytania</a>.<br></br>\n⚠️ Ta opcja zmodyfikuje plik .htaccess.\n"
