    automoderator_instructions:
      header: 'Instrukcja rozszerzenia'
      text: "<li>W skrócie: gdy użytkownik spełnia kryterium X, wykonaj Y. Gdy użytkownik przestaje spełniać kryterium X, wykonaj Z.</li>\n<li><strong>Kryteria:</strong> Kryteria są podstawą tego rozszerzenia. To dowolne zestawy metryk i wymagań. Gdy użytkownik zaczyna spełniać kryterium, wykonywane są wszystkie jego działania „przy spełnieniu”. Gdy użytkownik przestaje spełniać kryterium, wykonywane są wszystkie jego działania „przy utracie”.</li>\n<ul>\n  <li><strong>Metryka:</strong> Warunek liczbowy, np. liczba postów lub otrzymanych polubień. Kryterium może wymagać określonego zakresu, minimum lub maksimum metryk.</li>\n  <li><strong>Wymaganie:</strong> Abstrakcyjny warunek logiczny, np. brak bana lub adres e-mail pasujący do określonego wyrażenia regularnego.</li>\n</ul>\n<li><strong>Działania:</strong> Coś, co dzieje się automatycznie, gdy kryterium zostaje spełnione lub utracone – od dodania lub usunięcia grupy, przez wysłanie e-maila, po zbanowanie użytkownika.</li>\n<li><strong>Wyzwalacz:</strong> Zestaw zdarzeń, które powodują ponowną ocenę kryteriów użytkownika. Wyzwalacze są częścią definicji metryk i wymagań. Wszystkie kryteria są oceniane przy logowaniu – to „uniwersalny wyzwalacz”.</li>\n<li>Działania „przy utracie” są zawsze wykonywane przed działaniami „przy spełnieniu”. Dzięki temu działanie zostanie wykonane, dopóki użytkownik spełnia co najmniej jedno z kryteriów, które wykonują to działanie przy spełnieniu.</li>\n<li>Pamiętaj, że działania są wykonywane tylko „przy utracie” i „przy spełnieniu”. Ręczne zmiany wprowadzone, gdy użytkownik spełnia kryterium, nie spowodują ponownego wykonania jego działań „przy spełnieniu”.</li>\n<li>Jeśli usuniesz kryterium, działania „przy utracie” NIE zostaną wykonane dla użytkowników, którzy obecnie je spełniają.</li>\n<li>Jeśli używasz kryteriów do zarządzania grupami, zalecamy utrzymywanie osobnego zestawu grup zarządzanych wyłącznie przez kryteria. Nie będzie można ręcznie dodawać użytkowników do tych grup ani ich z nich usuwać.</li>\n"
